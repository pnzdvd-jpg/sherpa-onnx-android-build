name: Prepare sherpa 1.13.8 Android ARM64 without TTS

# Preparation only: no push/PR/schedule trigger, no app build or publication.
on:
  workflow_dispatch:
    inputs:
      authorized:
        description: 'Owner authorized execution and verified free runner/artifact usage and no paid overage'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sherpa-no-tts-arm64
  cancel-in-progress: false

jobs:
  library:
    # Fail closed on private repositories: do not consume unverified paid minutes.
    if: ${{ inputs.authorized && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 28.1.13356709
      CMAKE_VERSION: 3.22.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/sherpa-no-tts
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure pinned Android Command-line Tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install free Android build tools on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --version
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          # Google repository2-1.xml: ndk;28.1.13356709, Linux r28b.
          # Retain the exact NDK; do not silently use the runner's default version.
          test "$NDK_VERSION" = '28.1.13356709'
          ndk_archive="$RUNNER_TEMP/android-ndk-r28b-linux.zip"
          ndk_parent="$RUNNER_TEMP/sherpa-ndk-r28b"
          test ! -e "$ndk_parent"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 \
            --proto '=https' --proto-redir '=https' \
            'https://dl.google.com/android/repository/android-ndk-r28b-linux.zip' \
            --output "$ndk_archive"
          test "$(stat -c '%s' "$ndk_archive")" = '722264879'
          echo "f574d3165405bd59ffc5edaadac02689075a729f  $ndk_archive" | sha1sum --check
          sha256sum "$ndk_archive"
          unzip -tq "$ndk_archive"
          mkdir -p "$ndk_parent"
          unzip -q "$ndk_archive" -d "$ndk_parent"
          ndk_dir="$ndk_parent/android-ndk-r28b"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*28\.1\.13356709[[:space:]]*$' "$ndk_dir/source.properties"
          test -f "$ndk_dir/build/cmake/android.toolchain.cmake"
          test -x "$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          cat "$ndk_dir/source.properties"
          sdkmanager --sdk_root="$ANDROID_HOME" --install "cmake;$CMAKE_VERSION" "platforms;android-34" "build-tools;34.0.0"
          test -x "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake"
          test -x "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/ninja"
          echo "ANDROID_NDK=$ndk_dir" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin" >> "$GITHUB_PATH"
      - name: Build native library and standalone AAR (not the Sailing Setup APK)
        shell: bash
        run: bash tools/sherpa-no-tts/build.sh "$RUNNER_TEMP/sherpa-no-tts"
      - name: Verify ELF, symbols, packaging, dependency inventory and hashes
        shell: bash
        run: |
          python3 tools/sherpa-no-tts/verify.py \
            "$RUNNER_TEMP/sherpa-no-tts" \
            --llvm-bin "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - name: Upload candidate for review only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sherpa-1.13.8-no-tts-arm64-candidate
          path: ${{ runner.temp }}/sherpa-no-tts/result/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
